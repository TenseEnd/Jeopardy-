const T=["АТ-24-1","АТ-25-1у","АТ-25-3у"];
const D=[
["Негізгі ұғымдар",[
["Педагогикалық өзара әрекеттестік дегеніміз не?","Мұғалім мен оқушының мақсатты байланысы; нәтижесінде екі тарап та өзгереді: оқушыда жаңа білім, іскерлік пен көзқарас пайда болады, мұғалім сыныпты жақсы түсініп, жұмысын түзетеді."],
["«Өзара әрекеттестік» сөзіндегі «өзара» негізгі сөзі нені білдіреді?","Ықпал екі жаққа да бағытталған: мұғалім оқушыға да, оқушы мұғалімге де әсер етеді."],
["Мұғалім тек айтып, оқушылар тек тыңдаса, бұл не болады және неге бұл өзара әрекеттестік емес?","Бұл ақпарат беру, өйткені ықпал бір жақты, кері байланыс жоқ."],
["Оқушыны «объект» ретінде және «субъект» ретінде қарастыру тәсілдерінің айырмашылығы неде?","Объект: мұғалім не және қалай істеуді шешеді, оқушы орындайды. Субъект: оқушы пікір айтады, жұмыс тәсілін таңдайды, нәтижеге жауап береді."],
["Қай тәсіл тұлғаға бағытталған оқытудың негізінде жатыр және неліктен?","Екінші, субъектілік тәсіл: оқушы оқу процесінің толыққанды қатысушысы болады, бұған қазіргі мектеп ұмтылады."]]],
["Өзара әрекеттестік стильдері",[
["Педагогикалық өзара әрекеттестіктің қандай үш классикалық стилі бар?","Авторитарлық, либералдық (рұқсат етуші) және демократиялық."],
["Авторитарлық стильде мұғалім қалай әрекет етеді және қандай нәтиже береді?","Шешімді жеке өзі қабылдайды, қатаң бақылайды; тәртіп бар, бірақ оқушы бастамасы басылады, пәнге қызығушылық төмендейді."],
["Либералдық стильде жұмыс неліктен нашар нәтиже береді?","Мұғалім сыныпты дерлік бағыттамайды: оқушыларға еркін, бірақ жұмыс ретсіз, нәтиже әлсіз болады."],
["Қай стиль ең жақсы уәждеме мен дербестік береді және мұғалім онда не істейді?","Демократиялық: мұғалім оқушылармен ынтымақтасады, мақсатты түсіндіреді, таңдау ұсынады, бастаманы қолдайды."],
["Неліктен тәжірибелі мұғалім стильді өзгертіп отырады? Мысал келтіріңіз.","«Таза» стильдер сирек кездеседі, ситуацияға қарай икемделеді: бақылау жұмысында нақтылық қажет, жобалық жұмыста еркіндік қажет."]]],
["Іс-әрекетті басқару",[

["Тақырыппен алғашқы танысуға қандай әдістер сәйкес келеді?","Түсіндіру және көрсету (демонстрация)."],
["Ойлауды дамыту үшін қандай әдістер жақсы жұмыс істейді?","Проблемалық сұрақтар және зерттеу тапсырмалары."],
["Ынтымақтастыққа үйрету үшін және қызығушылықты қолдау үшін қандай әдістер қолданылады?","Ынтымақтастыққа: жұптық және топтық жұмыс, дискуссия, жобалар. Қызығушылыққа: ойын әдістері."],

["Модельдеу",[
["Педагогикада модельдеу деген не?","Оқытудың қалай өтетінін алдын ала ойластырып жобалау."],
["Мұғалім сабақтың «макетін» жасағанда нені анықтайды?","Мақсатты, мұғалім мен оқушылардың рөлдерін, әдістерді, әрекеттер ретін және күтілетін нәтижені."],
["Модельдеу не үшін қажет? Кемінде екі себеп атаңыз.","Сабақ тірі процесс, жоспарсыз ол оңай ыдырайды; модель қиындықты болжауға, нақты сыныпқа әдіс таңдауға, әдетте үндемейтіндерді тартуға көмектеседі."],
["Модельдеу қадамдарын ретімен атаңыз.","1) сыныпты талдау; 2) сабақ мақсатын қою; 3) әдіс пен форманы таңдау және өз рөлін ойластыру; 4) модельді сабақта тексеру; 5) талдап, түзетулер енгізу."],
["Сабақ мақсаты «нәтиже тілінде» қалай тұжырымдалады? Мысал келтіріңіз.","Оқушы сабақ соңына қарай нені істей алатыны көрсетіледі. Мысалы: Present Simple көмегімен өз күнін сипаттай алады."]]],
["Практика және қорытынды",[
["Практикалық мысалда қандай пән сабағы қарастырылды?","Ағылшын тілі."],
["Мысалдағы сабақтың мақсаты қандай?","Оқушыларды Present Simple көмегімен өз күнін сипаттауға үйрету."],
["Мұғалім-лектор бұл сабақты қалай өткізер еді?","Ережені түсіндіріп, жаттығулар берер еді."],
["Өзара әрекеттестікті модельдейтін мұғалім сабақты қалай өткізеді?","Ережені қысқаша енгізеді, содан кейін жұпта оқушылар бір-бірінен күн тәртібін сұрап, жауаптарын жазады, серіктесін сыныпқа таныстырады. Мұғалім ұйымдастырушы және көмекші."],
["Қорытынды: өзара әрекеттестік, іс-әрекетті басқару және модельдеу бір-бірімен қалай байланысты?","Өзара әрекеттестік екі жақты процесс, оның сапасы мұғалім стиліне тәуелді. Басқару оны мақсат, уәждеме, бақылау арқылы бағыттайды. Модельдеу мұның бәрін алдын ала жоспарлап, сабақтан сабаққа жетілдіруге мүмкіндік береді."]]]
];
const RC=["Основные понятия","Стили взаимодействия","Управление деятельностью","Моделирование","Практика и вывод"];
const R=[[
["Что такое педагогическое взаимодействие?","Целенаправленный контакт учителя и ученика, в результате которого меняются обе стороны: у ученика появляются знания, умения и отношение к предмету, а учитель лучше понимает класс и корректирует работу."],
["Что означает ключевое слово «взаимо» в слове «взаимодействие»?","Влияние идёт в обе стороны: учитель влияет на ученика, а ученик на учителя."],
["Если учитель только говорит, а ученики только слушают, что это такое и почему это не взаимодействие?","Это передача информации: влияние одностороннее, обратной связи нет."],
["Чем отличается подход, где ученик объект, от подхода, где он субъект?","Объект: учитель решает, что и как делать, ученик выполняет. Субъект: ученик высказывает мнение, выбирает способ работы, отвечает за результат."],
["Какой подход лежит в основе личностно-ориентированного обучения и почему?","Второй, субъектный: ученик полноправный участник обучения, к этому стремится современная школа."]],[
["Какие три классических стиля педагогического взаимодействия существуют?","Авторитарный, либеральный (попустительский) и демократический."],
["Как действует учитель при авторитарном стиле и к чему это приводит?","Единолично принимает решения и жёстко контролирует; порядок есть, но инициатива учеников подавляется, интерес к предмету часто падает."],
["Почему при либеральном стиле результаты работы получаются слабыми?","Учитель почти не направляет класс: ученикам свободно, но работа хаотична, результаты слабые."],
["Какой стиль даёт лучшую мотивацию и самостоятельность и что делает учитель при этом стиле?","Демократический: учитель сотрудничает с учениками, объясняет цели, предлагает выбор, поддерживает инициативу."],
["Почему опытный учитель меняет стиль в зависимости от ситуации? Приведите пример.","«Чистых» стилей почти не бывает; на контрольной нужна чёткость, на проектной работе нужна свобода."]],[
["Из каких трёх взаимосвязанных частей состоит управление деятельностью учащихся?","Постановка цели и организация работы; поддержка мотивации; контроль и оценка результата."],
["Какие методы подходят для первого знакомства с темой?","Объяснение и демонстрация."],
["Какие методы лучше всего развивают мышление?","Проблемные вопросы и исследовательские задания."],
["Какие методы учат сотрудничеству и какие поддерживают интерес?","Сотрудничеству: работа в парах и группах, дискуссии, проекты. Интерес: игровые методы."],

["Зачем нужно моделирование? Назовите минимум две причины.","Урок живой процесс, без плана он распадается; модель помогает предвидеть трудности, выбрать метод под класс, вовлечь даже молчаливых."],
["Назовите шаги построения модели взаимодействия по порядку.","1) анализ класса; 2) формулировка цели; 3) выбор метода и формы, продумывание своей роли; 4) проверка модели на уроке; 5) анализ и коррективы."],
["Как формулируется цель урока «на языке результата»? Приведите пример.","Указывается, что ученик сможет сделать к концу занятия. Например: описать свой день, используя Present Simple."]],[
["Урок какого предмета рассматривался в практическом примере?","Английский язык."],
["Какова цель урока в этом примере?","Научить учеников описывать свой день, используя Present Simple."],
["Как провёл бы этот урок учитель-лектор?","Просто объяснил бы правило и дал упражнения."],
["Как проводит урок учитель, который моделирует взаимодействие?","Коротко вводит правило, ученики в парах расспрашивают друг друга о распорядке дня и записывают ответы, затем представляют партнёра классу; учитель организатор и помощник."],
["Как связаны между собой педагогическое взаимодействие, управление деятельностью и моделирование?","Взаимодействие двусторонний процесс, его качество зависит от стиля учителя; управление направляет его через цели, мотивацию и контроль; моделирование позволяет всё планировать заранее и улучшать от урока к уроку."]]];
let teams=[[],[],[]],sc=[0,0,0],cur=null,left=25;
function shuffle(){
 const n=document.getElementById("names").value.split("\n").map(s=>s.trim()).filter(Boolean);
 if(n.length<3){alert("Кемінде 3 қатысушы енгізіңіз");return}
 for(let i=n.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[n[i],n[j]]=[n[j],n[i]]}
 teams=[[],[],[]];n.forEach((x,i)=>teams[i%3].push(x));
 const tn=[...T];
 document.getElementById("res").innerHTML='<div class="teams" style="margin-top:10px">'+teams.map((t,i)=>`<div class="t"><b>${tn[i]}</b><span>${t.join(", ")}</span></div>`).join("")+"</div>";
 document.getElementById("go").style.display="inline-block";
}
function start(){
 let h=D.map((c,ci)=>`<div class="cat">${c[0]}<br>/ ${RC[ci]}</div>`).join("");
 for(let r=0;r<5;r++)D.forEach((c,ci)=>h+=`<button class="tile" id="t${ci}_${r}" onclick="openQ(${ci},${r})">${(r+1)*100}</button>`);
 document.getElementById("bd").innerHTML=h;score();
}
function score(){
 document.getElementById("sb").innerHTML=T.map((t,i)=>`<div class="t"><b>${t}</b><div class="sc">${sc[i]}</div></div>`).join("");
}
function openQ(c,r){
 cur=[c,r];const q=D[c][1][r];
 const rq=R[c][r];mh.textContent=D[c][0]+" / "+RC[c]+" · "+(r+1)*100;mq.innerHTML=`<div>${q[0]}</div><div class="ru">${rq[0]}</div>`;ma.innerHTML=`<b>Жауап:</b> ${q[1]}<div class="ru"><b>Ответ:</b> ${rq[1]}</div>`;
 ma.style.display="none";sh.style.display="inline-block";aw.style.display="none";
 ab.innerHTML=T.map((t,i)=>`<button onclick="closeQ(${i})">✓ ${t}</button>`).join("");
 m.classList.add("o");
}
function boom(){for(let k=0;k<30;k++){const s=document.createElement("span");s.className="cf";s.textContent=["🎉","⭐","✨","🎊"][k%4];s.style.left=Math.random()*100+"vw";s.style.animationDelay=Math.random()*.4+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),2200)}}
function show(){ma.style.display="block";sh.style.display="none";aw.style.display="block"}
function closeQ(i){
 const [c,r]=cur;if(i>=0){sc[i]+=(r+1)*100;boom()}
 document.getElementById(`t${c}_${r}`).classList.add("u");
 m.classList.remove("o");score();
 if(--left==0){const mx=Math.max(...sc);setTimeout(()=>alert("Ойын аяқталды! Жеңімпаз: "+T.filter((t,i)=>sc[i]==mx).join(", ")),200)}
}
start();</script></body></html>
